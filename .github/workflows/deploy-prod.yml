name: DEPLOY RAPIDEA [PROD]

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

concurrency:
  group: deploy-rapidea-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📋 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔎 Lint
        run: npm run lint

      - name: 🏗️ Build static site
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: 📦 Create frontend archive
        run: |
          cd out
          tar -czf ../frontend-dist.tar.gz .
          cd ..
          ls -lh frontend-dist.tar.gz

      - name: 🧹 Clean frontend directory on VPS
        uses: appleboy/ssh-action@master
        with:
          host: 51.210.103.105
          username: ubuntu
          port: 22
          password: ${{ secrets.SSH_KEY }}
          script: |
            sudo rm -rf /var/rapidea/orderia/front/frontend 2>/dev/null || true
            sudo mkdir -p /var/rapidea/orderia/front/frontend/dist
            sudo chown -R ubuntu:ubuntu /var/rapidea/orderia/front
            sudo chmod -R 755 /var/rapidea/orderia/front

      - name: 📤 Copy frontend archive to VPS
        uses: appleboy/scp-action@master
        with:
          host: 51.210.103.105
          username: ubuntu
          port: 22
          password: ${{ secrets.SSH_KEY }}
          source: 'frontend-dist.tar.gz'
          target: '/tmp'

      - name: 📤 Extract frontend on VPS
        uses: appleboy/ssh-action@master
        with:
          host: 51.210.103.105
          username: ubuntu
          port: 22
          password: ${{ secrets.SSH_KEY }}
          script: |
            sudo tar -xzf /tmp/frontend-dist.tar.gz -C /var/rapidea/orderia/front/frontend/dist
            sudo chown -R ubuntu:ubuntu /var/rapidea/orderia/front
            sudo chmod -R 755 /var/rapidea/orderia/front
            rm -f /tmp/frontend-dist.tar.gz
            if [ -f /var/rapidea/orderia/front/frontend/dist/index.html ]; then
              echo "✅ index.html exists"
            else
              echo "❌ index.html NOT FOUND"
              ls -la /var/rapidea/orderia/front/frontend/dist/ | head -20
              exit 1
            fi

      - name: 🎉 Deployment Summary
        run: |
          echo "Deployed ${{ github.sha }} to https://rapidea.fr"
          echo "Path: /var/rapidea/orderia/front/frontend/dist"
