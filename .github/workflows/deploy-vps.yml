# CI + déploiement automatique sur VPS (SSH + git).
#
# Réutilise les mêmes secrets que Qadus / YogaOps :
#   VPS_SSH_PRIVATE_KEY  — clé privée PEM (recommandé)
#   VPS_SSH_PASSWORD     — mot de passe SSH (alternatif)
#   VPS_HOST             — IP du VPS (ex: 51.91.253.165)
#   VPS_USER             — utilisateur SSH (ex: ubuntu)
#
# Variables spécifiques Rapidea (Settings → Variables) :
#   VPS_APP_DIR          — chemin sur le VPS (défaut: /var/www/rapidea)
#   VPS_SSH_PORT         — port SSH (défaut: 22)
#
# Runtime sur le VPS (.env) :
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_FROM, SMTP_TO
#   PORT=3003

name: CI & déploiement VPS — Rapidea

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    needs: ci
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-vps-rapidea-production
      cancel-in-progress: false

    steps:
      - name: Vérifier auth SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_PASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          if [ -z "${SSH_KEY:-}" ] && [ -z "${SSH_PASS:-}" ]; then
            echo "::error::Ajoutez VPS_SSH_PRIVATE_KEY ou VPS_SSH_PASSWORD dans les secrets GitHub."
            exit 1
          fi

      - name: Déployer sur le VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST || '51.91.253.165' }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          port: ${{ vars.VPS_SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            APP_DIR="${{ vars.VPS_APP_DIR }}"
            BRANCH="main"
            if [ "${{ github.ref }}" = "refs/heads/master" ]; then
              BRANCH="master"
            fi
            if [ -z "$APP_DIR" ]; then
              for CANDIDATE in /var/www/rapidea /home/ubuntu/rapidea /root/rapidea; do
                if [ -d "$CANDIDATE/.git" ]; then
                  APP_DIR="$CANDIDATE"
                  break
                fi
              done
              APP_DIR="${APP_DIR:-/var/www/rapidea}"
            fi
            echo "=== Dossier app : $APP_DIR ==="
            echo "=== Commit GitHub : ${{ github.sha }} ==="
            echo "=== Branche : $BRANCH ==="
            if [ ! -d "$APP_DIR/.git" ]; then
              sudo mkdir -p "$APP_DIR"
              sudo chown "$(whoami):$(whoami)" "$APP_DIR"
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "${{ github.sha }}"
            echo "=== Commit VPS après reset : $(git rev-parse HEAD) ==="
            bash scripts/vps-deploy.sh

      - name: Vérifier rapidea.biganeway.fr accessible
        run: |
          echo "=== Vérification publique https://rapidea.biganeway.fr/ ==="
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://rapidea.biganeway.fr/ || echo "000")
            echo "tentative $attempt : HTTP $code"
            if [ "$code" = "200" ] || [ "$code" = "301" ] || [ "$code" = "302" ] || [ "$code" = "307" ] || [ "$code" = "308" ]; then
              echo "=== OK : rapidea.biganeway.fr accessible ==="
              exit 0
            fi
            sleep 15
          done
          echo "::warning::rapidea.biganeway.fr pas encore accessible (DNS / SSL / nginx) — vérifiez le VPS. Le déploiement SSH peut quand même être OK."
